name: FinSight CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  FRONTEND_BUILD_ID: ${{ github.sha }}

jobs:
  stage1-frontend-lint:
    name: Stage 1 - Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend lint
        run: npm run lint --prefix frontend

  stage2-backend-tests:
    name: Stage 2 - Backend Tests
    runs-on: ubuntu-latest
    needs: [stage1-frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Set deterministic backend test profile
        run: |
          echo "APP_MODE=development" >> "$GITHUB_ENV"
          echo "FINSIGHT_RUNTIME_PROFILE=test" >> "$GITHUB_ENV"
          echo "FINSIGHT_LLM_REQUIRED=false" >> "$GITHUB_ENV"
          echo "LANGGRAPH_CHECKPOINTER_BACKEND=memory" >> "$GITHUB_ENV"
          echo "LANGGRAPH_CHECKPOINTER_ALLOW_MEMORY_FALLBACK=true" >> "$GITHUB_ENV"
          echo "LANGGRAPH_SYNTHESIZE_MODE=stub" >> "$GITHUB_ENV"
          echo "OPENAI_COMPATIBLE_API_KEY=ci-dummy-key" >> "$GITHUB_ENV"
          echo "OPENAI_COMPATIBLE_API_BASE=https://ci.invalid/v1" >> "$GITHUB_ENV"
          echo "OPENAI_COMPATIBLE_MODEL=ci-dummy-model" >> "$GITHUB_ENV"
      - name: Run backend pytest suite
        run: >-
          pytest -q
          --cov=backend
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=75
          backend/tests tests/golden
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: |
            .coverage
            coverage.xml
          if-no-files-found: error

  stage3-retrieval-unit:
    name: Stage 3 - Retrieval Eval Unit
    runs-on: ubuntu-latest
    needs: [stage2-backend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run retrieval eval runner tests
        run: pytest -q tests/retrieval_eval/test_retrieval_eval_runner.py
      - name: Run rag_qualityV2 fast tests
        run: pytest -q tests/rag_qualityV2

  stage4-retrieval-gate:
    name: Stage 4 - Retrieval Gate
    runs-on: ubuntu-latest
    needs: [stage3-retrieval-unit]
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Enable pgvector extension
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres") as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
              conn.commit()
          print("pgvector extension ready")
          PY
      - name: Verify isolated PostgreSQL contracts
        env:
          FINSIGHT_POSTGRES_DSN: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/finsight_test_platform
          FINSIGHT_TEST_POSTGRES_DSN: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/finsight_test_platform
          FINSIGHT_RUNTIME_PROFILE: test
          FINSIGHT_LLM_REQUIRED: "false"
          RAG_EMBEDDING: hash
          RAG_RERANKER: none
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres", autocommit=True) as connection:
              connection.execute("CREATE DATABASE finsight_test_platform")
          PY
          python -m alembic upgrade head
          pytest -q backend/tests/test_rag_postgres_isolation.py backend/tests/test_research_run_postgres.py backend/tests/test_prediction_service_postgres.py backend/tests/test_report_directory_postgres.py
      - name: Verify retrieval dependency versions
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import transformers

          flag_ver = md.version("FlagEmbedding")
          st_ver = md.version("sentence-transformers")
          tf_ver = transformers.__version__
          print(f"FlagEmbedding={flag_ver}")
          print(f"sentence-transformers={st_ver}")
          print(f"transformers={tf_ver}")

          major = int(tf_ver.split(".")[0])
          if major >= 5:
              raise SystemExit("transformers major version must be <5 for FlagEmbedding compatibility")
          PY
      - name: Check embedding backend visibility
        run: |
          python - <<'PY'
          from backend.rag.embedder import EmbeddingService
          svc = EmbeddingService()
          model = svc.model_name
          print(f"Embedding backend: {model}")
          if model == "hash":
              print("::warning::RAG embedding backend is hash fallback (degraded mode).")
          PY
      - name: Run retrieval quality gate (memory)
        run: |
          python tests/retrieval_eval/run_retrieval_eval.py \
            --backend memory \
            --gate \
            --report-prefix ci_memory \
            --output-dir tests/retrieval_eval/reports/memory
      - name: Run retrieval quality gate (postgres)
        env:
          RAG_EMBEDDING: bge-m3
          RAG_V2_VECTOR_DIM: "1024"
          RAG_V2_POSTGRES_DSN: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/finsight_test_platform
        run: |
          python tests/retrieval_eval/run_retrieval_eval.py \
            --backend postgres \
            --postgres-dsn "$RAG_V2_POSTGRES_DSN" \
            --gate \
            --report-prefix ci_postgres \
            --output-dir tests/retrieval_eval/reports/postgres
      - name: Verify retrieval gate summaries
        run: |
          test -f tests/retrieval_eval/reports/memory/gate_summary.json
          test -f tests/retrieval_eval/reports/postgres/gate_summary.json
      - name: Upload retrieval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-reports-${{ github.sha }}
          path: |
            tests/retrieval_eval/reports/
          if-no-files-found: error

  stage5-frontend-unit:
    name: Stage 5 - Frontend Unit (vitest)
    runs-on: ubuntu-latest
    # Decoupled from retrieval-gate (Stage 4): frontend quality must run even when
    # the pgvector/FlagEmbedding retrieval gate is red. Only depends on lint.
    needs: [stage1-frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend unit tests
        run: npm run test:unit --prefix frontend

  stage6-frontend-build:
    name: Stage 6 - Frontend Build
    runs-on: ubuntu-latest
    # Decoupled from retrieval-gate (Stage 4) so build/e2e are never skipped by a
    # flaky retrieval gate. Backend tests (Stage 2) + frontend unit (Stage 5) gate.
    needs: [stage2-backend-tests, stage5-frontend-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Verify generated OpenAPI TypeScript schema
        run: |
          npm run gen:api --prefix frontend
          git diff --exit-code -- frontend/src/api/schema.d.ts
      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: |
            frontend/dist/
          if-no-files-found: error

  stage7-e2e:
    name: Stage 7 - E2E
    runs-on: ubuntu-latest
    # E2E depends only on a successful frontend build, never on retrieval-gate.
    needs: [stage6-frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e --prefix frontend
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.sha }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn

  stage8-artifact-bundle:
    name: Stage 8 - Bundle Artifacts
    runs-on: ubuntu-latest
    needs:
      - stage2-backend-tests
      - stage4-retrieval-gate
      - stage6-frontend-build
      - stage7-e2e
    if: success()
    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: release-evidence/backend-coverage
      - name: Download retrieval reports
        uses: actions/download-artifact@v4
        with:
          name: retrieval-reports-${{ github.sha }}
          path: release-evidence/retrieval-reports
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: release-evidence/frontend-dist
      - name: Download e2e artifacts
        uses: actions/download-artifact@v4
        with:
          name: e2e-artifacts-${{ github.sha }}
          path: release-evidence/e2e
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            release-evidence/
          if-no-files-found: error
